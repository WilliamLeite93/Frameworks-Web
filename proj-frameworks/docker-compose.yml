services:
  postgres:
    image: postgres:16-alpine
    container_name: brainlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB nao definida}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER nao definido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definido}
    volumes:
      - brainlog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    container_name: brainlog-api
    restart: unless-stopped
    user: node
    working_dir: /app
    command: sh -c "npm run prisma:generate && npm run prisma:deploy && npm run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL nao definida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET nao definido}
      PORT: ${BACKEND_PORT:-3030}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3031}
      PASSWORD_RESET_TOKEN_MINUTES: ${PASSWORD_RESET_TOKEN_MINUTES:-30}
      MAILTRAP_API_KEY: ${MAILTRAP_API_KEY:-}
      MAILTRAP_USE_SANDBOX: ${MAILTRAP_USE_SANDBOX:-true}
      MAILTRAP_INBOX_ID: ${MAILTRAP_INBOX_ID:-}
      MAILTRAP_FROM_EMAIL: ${MAILTRAP_FROM_EMAIL:-sandbox@example.com}
      MAILTRAP_FROM_NAME: ${MAILTRAP_FROM_NAME:-BrainLog}
    ports:
      - "${BACKEND_PORT:-3030}:${BACKEND_PORT:-3030}"
    volumes:
      - ./backend:/app
      - brainlog_api_node_modules:/app/node_modules
      - brainlog_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: brainlog-frontend
    restart: unless-stopped
    user: node
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:?VITE_API_URL nao definida}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-brainlog.frameworksenac.com.br}
      VITE_PROXY_TARGET: http://api:${BACKEND_PORT:-3030}
    ports:
      - "${FRONTEND_PORT:-3031}:5173"
    volumes:
      - ./frontend:/app
      - brainlog_frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  brainlog_postgres_data:
  brainlog_api_node_modules:
  brainlog_frontend_node_modules:
  brainlog_uploads:
