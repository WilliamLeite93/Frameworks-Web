services:
  postgres:
    image: postgres:16-alpine
    container_name: brainlog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB nao definida}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER nao definido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definido}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brainlog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: brainlog-api:${APP_VERSION:-latest}
    container_name: brainlog-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL nao definida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET nao definido}
      PORT: ${BACKEND_PORT:-3030}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
    ports:
      - "${BACKEND_PORT:-3030}:${BACKEND_PORT:-3030}"
    volumes:
      - brainlog_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL nao definida}
    image: brainlog-frontend:${APP_VERSION:-latest}
    container_name: brainlog-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  brainlog_postgres_data:
  brainlog_uploads:
